[project]
name = "my-dice-roll"
version = "2.0.0"
description = "tkinter でダイスロールをするアプリ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 元の名前を残しているファイル名。
"MyDiceRoll.py" = ["N999"]
# assert と、自分のスクリプトを動かす subprocess と、わざと全角を書いたテスト。
"tests/*" = ["S101", "S603", "RUF001"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
